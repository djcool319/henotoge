name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Henotoge.xcodeproj \
            -target Henotoge \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: |BUILD" || true
          test -d build/Release-iphoneos/Henotoge.app

      - name: Show errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -E "error:" build.log | sort -u | head -50 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Henotoge.app Payload/
          zip -qry henotoge.ipa Payload
          ls -lh henotoge.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: henotoge-ipa
          path: henotoge.ipa

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest henotoge.ipa \
            --title "最新ビルド (${GITHUB_SHA::7})" \
            --notes "main の最新コミットから自動ビルドした未署名 ipa。Sideloadly / AltStore で署名してインストールしてください。" \
            --prerelease
